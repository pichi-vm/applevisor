name: Probe HVF controller extents
on:
  push:
    branches: [validation/hvf-gic-extents]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-probe:
    runs-on: [self-hosted, macOS, ARM64, bare-metal, m1]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Record workflow revision
        run: git rev-parse HEAD
      - name: Install Rust
        run: rustup toolchain install nightly-2026-07-06 --profile minimal
      - name: Prepare standalone probe
        run: |
          PROBE_DIR="$RUNNER_TEMP/hvf-gic-probe-$GITHUB_RUN_ID"
          echo "PROBE_DIR=$PROBE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PROBE_DIR/src"
          cat > "$PROBE_DIR/Cargo.toml" <<'PROBE_FILE_END'
          [package]
          name = "dillo-hvf-gic-probe"
          version = "0.1.0"
          edition = "2024"
          publish = false
          
          [dependencies]
          applevisor = { git = "https://github.com/pichi-vm/applevisor", rev = "1f60794ae520bc5701ea9d35ca2c2048e3c76923" }
          PROBE_FILE_END
          cat > "$PROBE_DIR/Cargo.lock" <<'PROBE_FILE_END'
          # This file is automatically @generated by Cargo.
          # It is not intended for manual editing.
          version = 4
          
          [[package]]
          name = "applevisor"
          version = "1.0.0"
          source = "git+https://github.com/pichi-vm/applevisor?rev=1f60794ae520bc5701ea9d35ca2c2048e3c76923#1f60794ae520bc5701ea9d35ca2c2048e3c76923"
          dependencies = [
           "applevisor-sys",
          ]
          
          [[package]]
          name = "applevisor-sys"
          version = "1.0.0"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "14ae37676989768c5b21414857b782a5e513d93129cda34854f5f78c423a63be"
          dependencies = [
           "libc",
          ]
          
          [[package]]
          name = "dillo-hvf-gic-probe"
          version = "0.1.0"
          dependencies = [
           "applevisor",
          ]
          
          [[package]]
          name = "libc"
          version = "0.2.186"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "68ab91017fe16c622486840e4c83c9a37afeff978bd239b5293d61ece587de66"
          PROBE_FILE_END
          cat > "$PROBE_DIR/src/main.rs" <<'PROBE_FILE_END'
          use applevisor::prelude::{GicConfig, GicMsiReg, VirtualMachine, VirtualMachineConfig};
          use std::process::ExitCode;
          
          const DISTRIBUTOR: u64 = 0x0800_0000;
          const REDISTRIBUTOR: u64 = 0x0810_0000;
          const MSI: u64 = 0x0a10_0000;
          const MSI_INTID_BASE: u32 = 64;
          
          fn main() -> ExitCode {
              let count = match std::env::args().nth(1).as_deref() {
                  Some("32") => 32,
                  Some("0") => 0,
                  _ => {
                      eprintln!("usage: dillo-hvf-gic-probe <32|0>");
                      return ExitCode::FAILURE;
                  }
              };
          
              println!("pid={} count={count} phase=before_vm", std::process::id());
              let dist_size = GicConfig::get_distributor_size();
              let redist_region_size = GicConfig::get_redistributor_region_size();
              let redist_size = GicConfig::get_redistributor_size();
              let msi_size = GicConfig::get_msi_region_size();
              println!("distributor_size={dist_size:?}");
              println!("redistributor_region_size={redist_region_size:?}");
              println!("redistributor_per_vcpu_size={redist_size:?}");
              println!("msi_region_size={msi_size:?}");
              let sizes_observed = [dist_size, redist_region_size, redist_size, msi_size]
                  .iter()
                  .all(|size| matches!(size, Ok(1..)));
          
              let mut vm_config = VirtualMachineConfig::new();
              let max_ipa_size = VirtualMachineConfig::get_max_ipa_size();
              println!("max_ipa_bits={max_ipa_size:?}");
              let ipa = max_ipa_size.and_then(|bits| vm_config.set_ipa_size(bits));
          
              let mut gic_config = GicConfig::new();
              let distributor = gic_config.set_distributor_base(DISTRIBUTOR);
              let redistributor = gic_config.set_redistributor_base(REDISTRIBUTOR);
              let msi = gic_config.set_msi_region_base(MSI);
              println!("set_ipa={ipa:?}");
              println!("set_distributor_base={DISTRIBUTOR:#x} result={distributor:?}");
              println!("set_redistributor_base={REDISTRIBUTOR:#x} result={redistributor:?}");
              println!("set_msi_base={MSI:#x} result={msi:?}");
              if [ipa, distributor, redistributor, msi]
                  .iter()
                  .any(Result::is_err)
              {
                  println!("vm_with_gic=not_attempted reason=setup_failed");
                  return ExitCode::FAILURE;
              }
          
              let msi_range = gic_config.set_msi_interrupt_range(MSI_INTID_BASE, count);
              println!("set_msi_interrupt_range base={MSI_INTID_BASE} count={count} result={msi_range:?}");
              if msi_range.is_err() {
                  println!("vm_with_gic=not_attempted reason=msi_range_refused");
                  return if count == 0 && sizes_observed {
                      ExitCode::SUCCESS
                  } else {
                      ExitCode::FAILURE
                  };
              }
          
              match VirtualMachine::with_gic(vm_config, gic_config) {
                  Ok(vm) => {
                      println!("vm_with_gic=ok");
                      let typer = vm.gic_get_msi_reg(GicMsiReg::TYPER);
                      println!("native_gicm_typer={typer:#x?}");
                      drop(vm);
                      println!("native_vm_dropped");
                  }
                  Err(error) => {
                      println!("vm_with_gic=error error={error:?}");
                      if count == 32 {
                          return ExitCode::FAILURE;
                      }
                  }
              }
              if sizes_observed {
                  ExitCode::SUCCESS
              } else {
                  ExitCode::FAILURE
              }
          }
          PROBE_FILE_END
          cat > "$PROBE_DIR/run-signed.sh" <<'PROBE_FILE_END'
          #!/usr/bin/env bash
          set -euo pipefail
          
          if [[ "$(uname -s)" != Darwin || "$(uname -m)" != arm64 ]]; then
              printf '%s\n' 'Run the probe on Apple Silicon macOS.' >&2
              exit 1
          fi
          
          cd -- "$(dirname -- "$0")"
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          
          uname -a
          sw_vers
          rustc --version
          CARGO_TARGET_DIR="$work/target" cargo build --locked --target aarch64-apple-darwin
          cp -- "$work/target/aarch64-apple-darwin/debug/dillo-hvf-gic-probe" "$work/probe"
          codesign --force --sign - --entitlements hypervisor.plist "$work/probe"
          codesign --verify --strict "$work/probe"
          
          python3 - "$work/probe" <<'PY'
          import subprocess
          import sys
          
          statuses = []
          for count in ("32", "0"):
              print(f"starting_child count={count}", flush=True)
              try:
                  result = subprocess.run([sys.argv[1], count], timeout=10, check=False)
              except subprocess.TimeoutExpired:
                  print(f"child_result count={count} timeout=10s", flush=True)
                  statuses.append(False)
              else:
                  print(f"child_result count={count} status={result.returncode}", flush=True)
                  statuses.append(result.returncode == 0)
          sys.exit(0 if all(statuses) else 1)
          PY
          PROBE_FILE_END
          cat > "$PROBE_DIR/hypervisor.plist" <<'PROBE_FILE_END'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.security.hypervisor</key><true/></dict></plist>
          PROBE_FILE_END
          chmod +x "$PROBE_DIR/run-signed.sh"
      - name: Build, sign and execute isolated cases
        run: |
          cd "$PROBE_DIR"
          rustup run nightly-2026-07-06 bash -o pipefail -c './run-signed.sh 2>&1 | tee native.log'
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hvf-gic-native-evidence
          path: ${{ env.PROBE_DIR }}/native.log
          if-no-files-found: warn
